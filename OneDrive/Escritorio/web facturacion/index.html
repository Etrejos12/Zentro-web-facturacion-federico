<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/logo principal.png" type="image/png">
    <script type="module" src="js/login.js"></script>
    <title>Dashboard Federico</title>
</head>
<body>
    <main class="contenedor">
        
        <form class="tarjeta" id="loginForm" action=>

            <div class="marca">
                <img class="logo" src="assets/logo principal.png" alt="Logo de Federico Arango V.">
                <span class="nombre">
                    Federico Arango V.
                    <small>Médico veterinario</small>
                </span>
            </div>

            <h1>Iniciar sesión</h1>

            <div class="campo">
                <label for="Usuario">Usuario:</label>
                <input type="text" id="Usuario" name="usuario" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="campo">
                <label for="Contraseña">Contraseña</label>
                <input type="password" id="Contraseña" name="contraseña" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
